name: Build & release

# Builds the Mac .dmg and Windows .exe and publishes them to GitHub Releases.
# Runs automatically when package.json changes on main (i.e. you bumped the
# version) – or press "Run workflow" on the Actions tab.
# New version  -> builds and publishes a GitHub Release (installed apps auto-update).
# Same version -> a push does nothing; "Run workflow" still compiles and attaches the
#                 .dmg/.exe to the run page as downloads, without touching the release.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "v$VERSION is already released – no new release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            gh release view "v$VERSION" >/dev/null 2>&1 || \
              gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "Unique AV RF Scan $VERSION" --notes "Unique AV RF Scan $VERSION"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    env:
      PUBLISH: ${{ needs.prepare.outputs.release == 'true' && 'always' || 'never' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - name: Build & upload (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          # Drop signing/notarising settings that aren't configured (blank secrets break electron-builder)
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -z "${!v}" ] && unset "$v"
          done
          npx electron-builder --mac --publish $PUBLISH 2>&1 | tee build.log || {
            echo "::error title=Mac build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional – add these repo secrets to sign + notarise the Mac app.
          # Without them the Mac build is unsigned (see README).
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}

      - name: Build & upload (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish $PUBLISH 2>&1 | tee build.log || {
            echo "::error title=Windows build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach installers to this run
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: UniqueAV-RF-Scan-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
