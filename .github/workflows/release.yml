name: Build & release

# Builds the Mac .dmg and Windows .exe and publishes them to GitHub Releases.
# Runs automatically when package.json changes on main (i.e. you bumped the
# version) – or press "Run workflow" on the Actions tab. If a release for the
# current version already exists, nothing is rebuilt.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "v$VERSION is already released – skipping build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            gh release view "v$VERSION" >/dev/null 2>&1 || \
              gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "Unique AV RF Scan $VERSION" --notes "Unique AV RF Scan $VERSION"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - name: Build & upload (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --mac --publish always 2>&1 | tee build.log || {
            echo "::error title=Mac build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional – add these repo secrets to sign + notarise the Mac app.
          # Without them the Mac build is unsigned (see README).
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}

      - name: Build & upload (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish always 2>&1 | tee build.log || {
            echo "::error title=Windows build failed::$(tail -n 40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
